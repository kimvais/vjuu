name: Release

# Push a tag matching the Cargo.toml version (git tag v0.1.0 && git push origin v0.1.0) to build and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          # 22.04's older glibc lets the Linux binaries run on more distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} != Cargo.toml version ${version}"; exit 1; }
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "vjuu-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/vjuu.exe, README.md, LICENSE -DestinationPath "dist/$name.zip"
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="vjuu-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/vjuu README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - name: Package (.deb)
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-deb
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The package-manager jobs skip themselves until their secret exists, so a release never fails on them.

  homebrew:
    # brew install kimvais/tap/vjuu: rewrites Formula/vjuu.rb in github.com/kimvais/homebrew-tap.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::HOMEBREW_TAP_KEY not set; skipping Homebrew"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: kimvais/homebrew-tap
          # A write deploy key on homebrew-tap: scoped to that one repo and never expires.
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - if: steps.check.outputs.ok == 'true'
        name: Update the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm=$(sha256sum "dist/vjuu-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          intel=$(sha256sum "dist/vjuu-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${version}/g" -e "s/@SHA_ARM@/${arm}/" -e "s/@SHA_INTEL@/${intel}/" packaging/homebrew/vjuu.rb > tap/Formula/vjuu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vjuu.rb
          git commit -m "vjuu ${version}"
          git push

  apt:
    # apt install vjuu: a signed apt repository on this repo's GitHub Pages (Settings > Pages > Source: GitHub Actions).
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - id: check
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::APT_GPG_PRIVATE_KEY not set; skipping apt"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.check.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - if: steps.check.outputs.ok == 'true'
        name: Build and sign the repository
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: packaging/apt/build-repo.sh dist site/apt
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.check.outputs.ok == 'true'
        uses: actions/deploy-pages@v4

  winget:
    # winget install vjuu: opens a pull request to microsoft/winget-pkgs. Works once the first version has been
    # merged there (see packaging/winget/README.md).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::WINGET_TOKEN not set; skipping winget"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.ok == 'true'
        name: Submit the update
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          cargo install --locked komac
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          komac update kimvais.vjuu --version "${GITHUB_REF_NAME#v}" --submit \
            --urls "${base}/vjuu-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" "${base}/vjuu-${GITHUB_REF_NAME}-aarch64-pc-windows-msvc.zip"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vjuu</title>
<!-- Fetch fonts alongside the scripts; otherwise first paint waits for them after layout. -->
<link rel="preload" href="vendor/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/diff2html.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The window is frameless: this is its title bar. Empty space drags the window. -->
<header id="titlebar">
  <span id="brand">vjuu</span>
  <span id="session"></span>
  <span id="name"></span>
  <select id="theme" title="Theme (t)">
    <option value="auto">Auto</option>
    <option value="light">Light</option>
    <option value="graphite">Graphite</option>
  </select>
  <button id="view" hidden title="Toggle unified / side-by-side (v)">Side-by-side</button>
  <button id="settings-open" title="Settings">&#x2699;</button>
  <div id="window-controls">
    <button data-cmd="minimize" title="Minimize">&#xE921;</button>
    <button data-cmd="maximize" id="max" title="Maximize">&#xE922;</button>
    <button data-cmd="close" id="close" title="Close">&#xE8BB;</button>
  </div>
</header>
<nav id="files" hidden title="Files (f to hide)"></nav>
<div id="scroll">
  <main id="content"></main>
  <section id="overall-box">
    <label for="overall">Overall</label>
    <textarea id="overall" rows="3" placeholder="General comment (optional)"></textarea>
  </section>
  <button id="sel-comment" hidden title="Comment on the selected lines (c)">Comment</button>
</div>
<footer id="statusbar">
  <span id="count"></span>
  <span id="hint">&uarr;&darr; move &middot; Enter or click to comment &middot; &larr;&rarr; files &middot; Ctrl+Enter done</span>
  <button id="done" title="Ctrl+Enter">Done</button>
</footer>
<dialog id="settings">
  <h2>Settings</h2>
  <p>What vjuu opens for Claude Code. Changes are saved right away.</p>
  <label><input type="checkbox" name="plan"><b>Plan review</b>
    <span>Open a finished plan before you approve it; comments send it back to Claude.</span></label>
  <label><input type="checkbox" name="ask"><b>Questions</b>
    <span>Answer Claude's questions here instead of the terminal picker.</span></label>
  <label><input type="checkbox" name="turn"><b>Turn review</b>
    <span>After each turn with edits, open the diff of what Claude changed.</span></label>
  <p class="cli">Also <code>vjuu config</code> in a terminal.</p>
  <button id="settings-close">Close</button>
</dialog>
<!-- Resize handles: the webview covers the window, so its edges have to be handled here. -->
<div class="edge" data-dir="n"></div><div class="edge" data-dir="s"></div>
<div class="edge" data-dir="e"></div><div class="edge" data-dir="w"></div>
<div class="edge" data-dir="ne"></div><div class="edge" data-dir="nw"></div>
<div class="edge" data-dir="se"></div><div class="edge" data-dir="sw"></div>
<script src="app.js"></script>
</body>
</html>

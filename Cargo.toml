[package]
name = "vjuu"
version = "0.1.0"
edition = "2024"
description = "Fast review window for AI-agent handoffs: markdown, diffs and code with inline comments."
license = "MIT"
repository = "https://github.com/kimvais/vjuu"

[dependencies]
interprocess = "2.4.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
wry = "0.57.0"
